name: PHP Syntax Check

on:
  push:
    paths:
      - '**/*.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - '**/*.php'
      - '.github/workflows/php-lint.yml'

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          find modules -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
