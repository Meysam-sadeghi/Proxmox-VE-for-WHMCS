name: Security Regression Checks

on:
  push:
    paths:
      - 'modules/**'
      - '.github/workflows/security-regression.yml'
  pull_request:
    paths:
      - 'modules/**'
      - '.github/workflows/security-regression.yml'

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject insecure PVE TLS defaults
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --include='*.php' 'CURLOPT_SSL_VERIFYPEER, false' modules/addons/pvewhmcs modules/servers/pvewhmcs
          ! grep -RIn --include='*.php' 'CURLOPT_SSL_VERIFYHOST, false' modules/addons/pvewhmcs modules/servers/pvewhmcs
          grep -Fq '$verify_ssl = true' modules/addons/pvewhmcs/proxmox.php

      - name: Verify TLS disable attempts fail closed
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "modules/addons/pvewhmcs/proxmox.php";
            try {
                new PVE2_API("localhost", "whmcs@pve!provisioning", "pve", "test-secret", 8006, false);
                fwrite(STDERR, "verify_ssl=false was accepted\n");
                exit(1);
            } catch (PVE2_Exception $e) {
                if (strpos($e->getMessage(), "cannot be disabled") === false) {
                    fwrite(STDERR, "unexpected exception: " . $e->getMessage() . "\n");
                    exit(1);
                }
            }
          '

      - name: Verify PVE login ticket expiry behavior
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "modules/addons/pvewhmcs/proxmox.php";

            $api = new PVE2_API(
                "localhost",
                "vnc",
                "pve",
                "test-console-secret",
                8006,
                true,
                false
            );

            $class = new ReflectionClass($api);
            $ticket = $class->getProperty("login_ticket");
            $timestamp = $class->getProperty("login_ticket_timestamp");
            $check = $class->getMethod("check_login_ticket");
            $ticket->setAccessible(true);
            $timestamp->setAccessible(true);
            $check->setAccessible(true);

            $ticket->setValue($api, array(
                "ticket" => "PVE:test-ticket",
                "CSRFPreventionToken" => "test-csrf"
            ));
            $timestamp->setValue($api, time() - 60);

            if ($check->invoke($api) !== true) {
                fwrite(STDERR, "young PVE ticket was rejected\n");
                exit(1);
            }

            $timestamp->setValue($api, time() - 7201);
            if ($check->invoke($api) !== false) {
                fwrite(STDERR, "expired PVE ticket was accepted\n");
                exit(1);
            }

            if ($ticket->getValue($api) !== null || $timestamp->getValue($api) !== null) {
                fwrite(STDERR, "expired PVE ticket state was not cleared\n");
                exit(1);
            }
          '

      - name: Require root credential prohibition
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'root@pam credentials are prohibited' modules/addons/pvewhmcs/proxmox.php
          grep -Fq 'PVEAPIToken=' modules/addons/pvewhmcs/proxmox.php

      - name: Require API tokens for management authentication
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '$require_api_token = true' modules/addons/pvewhmcs/proxmox.php
          php -r '
            require "modules/addons/pvewhmcs/proxmox.php";

            try {
                new PVE2_API("localhost", "whmcs@pve", "pve", "test-password", 8006);
                fwrite(STDERR, "default password authentication was accepted\n");
                exit(1);
            } catch (PVE2_Exception $e) {
                if (strpos($e->getMessage(), "requires a dedicated API token") === false) {
                    fwrite(STDERR, "unexpected default-auth exception: " . $e->getMessage() . "\n");
                    exit(1);
                }
            }

            $token = new PVE2_API(
                "localhost",
                "whmcs@pve!provisioning",
                "pve",
                "test-token-secret",
                8006
            );

            $console = new PVE2_API(
                "localhost",
                "vnc",
                "pve",
                "test-console-secret",
                8006,
                true,
                false
            );
          '


      - name: Verify log redaction and minimization
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "modules/addons/pvewhmcs/security.php";

            $secretValues = array(
                "hunter2",
                "token-secret-123",
                "PVE-ticket-secret",
                "csrf-secret-456",
                "vnc-secret-789"
            );

            $input = array(
                "serverpassword" => "hunter2",
                "nested" => array(
                    "token" => "token-secret-123",
                    "safe" => "keep-me"
                ),
                "message" => "PVEAuthCookie=PVE-ticket-secret csrfpreventiontoken=csrf-secret-456 vncticket=vnc-secret-789"
            );

            $redacted = json_encode(pvewhmcs_redact_log_value($input));
            foreach ($secretValues as $secret) {
                if (strpos($redacted, $secret) !== false) {
                    fwrite(STDERR, "secret survived redaction: " . $secret . "\n");
                    exit(1);
                }
            }

            $summary = json_encode(pvewhmcs_safe_log_result(array(
                "password" => "hunter2",
                "vmid" => 100
            )));

            if (strpos($summary, "hunter2") !== false) {
                fwrite(STDERR, "safe response summary leaked a value\n");
                exit(1);
            }
          '
          ! grep -Fq 'json_encode($cluster_resources)' modules/addons/pvewhmcs/pvewhmcs.php
          ! grep -Fq 'json_encode($tasks)' modules/addons/pvewhmcs/pvewhmcs.php

      - name: Require centralized secret-safe module logging
        shell: bash
        run: |
          set -euo pipefail

          # First-party code may only invoke WHMCS logModuleCall through the
          # mandatory wrapper in security.php.
          ! grep -RIn --include='*.php' 'logModuleCall('             modules/servers/pvewhmcs             modules/addons/pvewhmcs/pvewhmcs.php

          grep -Fq 'function pvewhmcs_secure_log_module_call' modules/addons/pvewhmcs/security.php

          php -r '
            $GLOBALS["captured_log"] = null;

            function logModuleCall($module, $action, $request, $response, $processedData = "", $replaceVars = array()) {
                $GLOBALS["captured_log"] = array(
                    "module" => $module,
                    "action" => $action,
                    "request" => $request,
                    "response" => $response,
                    "processedData" => $processedData,
                    "replaceVars" => $replaceVars
                );
            }

            require "modules/addons/pvewhmcs/security.php";

            pvewhmcs_secure_log_module_call(
                "pvewhmcs",
                "test",
                array(
                    "serverpassword" => "request-secret",
                    "nested" => array("authorization" => "Bearer token-secret")
                ),
                "PVEAuthCookie=pve-cookie-secret vncticket=vnc-ticket-secret",
                array("password" => "processed-secret"),
                array("replace-secret")
            );

            $encoded = json_encode($GLOBALS["captured_log"]);
            foreach (array(
                "request-secret",
                "token-secret",
                "pve-cookie-secret",
                "vnc-ticket-secret",
                "processed-secret",
                "replace-secret"
            ) as $secret) {
                if (strpos($encoded, $secret) !== false) {
                    fwrite(STDERR, "secret reached logModuleCall: " . $secret . "\n");
                    exit(1);
                }
            }
          '

      - name: Keep console bootstrap POST-only and URL-clean
        shell: bash
        run: |
          set -euo pipefail

          # Console launch nonce must be in the POST body, never the public URL.
          ! grep -InE 'novnc_router\.php\?.*session=' modules/servers/pvewhmcs/pvewhmcs.php
          grep -Fq '<form method="post"' modules/servers/pvewhmcs/pvewhmcs.php
          grep -Fq 'name="session"' modules/servers/pvewhmcs/pvewhmcs.php

          # Router must reject non-POST requests and accept no console state
          # from query-string input.
          grep -Fq "\$_SERVER['REQUEST_METHOD'] !== 'POST'" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "\$_POST['session']" modules/servers/pvewhmcs/novnc_router.php
          ! grep -Fq '$_GET[' modules/servers/pvewhmcs/novnc_router.php
          ! grep -InE '\$_(POST|REQUEST)\[(.host.|.port.|.path.|.pveticket.|.vncticket.|.vmid.|.node.)\]'             modules/servers/pvewhmcs/novnc_router.php

          # The obsolete second-stage endpoint must stay removed.
          test ! -e modules/servers/pvewhmcs/novnc_client.php

          grep -Fq "Referrer-Policy: no-referrer" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq 'Cross-Origin-Opener-Policy: same-origin' modules/servers/pvewhmcs/novnc_router.php
          grep -Fq 'Console authorization state changed during bootstrap' modules/servers/pvewhmcs/novnc_router.php

      - name: Keep noVNC destination server-side and CSP-pinned
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'FILTER_VALIDATE_DOMAIN' modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "\$cspConnect = 'wss://' . \$apiHost . ':' . \$apiPort;" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq '"connect-src '\''self'\'' " . $cspConnect' modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "where('userid', '=', \$clientId)" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "where('id', '=', \$serviceId)" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "where('id', '=', \$serverId)" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "hash_equals(\$apiHost, \$currentHost)" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "while (count(\$_SESSION['pvewhmcs_console']) >= 5)" modules/servers/pvewhmcs/pvewhmcs.php

      - name: Keep PVE console cookie short-lived and cleared after handshake
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "'expires' => time() + 60" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "'httponly' => true" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "'samesite' => 'Strict'" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "'path' => '/api2/json/'" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "fetch('./novnc_cookie_clear.php'" modules/servers/pvewhmcs/novnc_router.php
          grep -Fq "\$_SESSION['pvewhmcs_console_clear']" modules/servers/pvewhmcs/novnc_router.php
          test -f modules/servers/pvewhmcs/novnc_cookie_clear.php
          grep -Fq "\$_SERVER['REQUEST_METHOD'] !== 'POST'" modules/servers/pvewhmcs/novnc_cookie_clear.php
          grep -Fq "unset(\$_SESSION['pvewhmcs_console_clear'][\$nonce])" modules/servers/pvewhmcs/novnc_cookie_clear.php
          grep -Fq "hash_equals((string) \$entry['cookie_domain'], \$cookieDomain)" modules/servers/pvewhmcs/novnc_cookie_clear.php
          grep -Fq "http_response_code(204)" modules/servers/pvewhmcs/novnc_cookie_clear.php

      - name: Keep addon deletes POST-only
        shell: bash
        run: |
          set -euo pipefail
          ! grep -InE "action=(removeplan|removeippool|removeip)" modules/addons/pvewhmcs/pvewhmcs.php
          grep -Fq "check_token();" modules/addons/pvewhmcs/pvewhmcs.php
          grep -Fq "pvewhmcs_delete_action" modules/addons/pvewhmcs/pvewhmcs.php
          ! grep -Fq -- "->where('id', \$_GET['id'])" modules/addons/pvewhmcs/pvewhmcs.php
          grep -Fq "function update_qemu_plan(\$id)" modules/addons/pvewhmcs/pvewhmcs.php
          grep -Fq "function update_lxc_plan(\$id)" modules/addons/pvewhmcs/pvewhmcs.php
          test "$(grep -Fc 'name="plan_id"' modules/addons/pvewhmcs/pvewhmcs.php)" -ge 2

      - name: Structurally verify addon POST CSRF coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("modules/addons/pvewhmcs/pvewhmcs.php").read_text(encoding="utf-8")

          # Every emitted POST form must carry the module's WHMCS admin token
          # helper somewhere before that form's closing tag.
          form_starts = list(re.finditer(
              r'<form\b[^>]*method=["\']post["\'][^>]*>',
              source,
              flags=re.IGNORECASE,
          ))
          if len(form_starts) < 9:
              raise SystemExit(f"expected at least 9 addon POST forms, found {len(form_starts)}")

          missing = []
          for index, match in enumerate(form_starts, start=1):
              close = source.find("</form>", match.end())
              if close < 0:
                  raise SystemExit(f"POST form {index} has no closing form tag")
              block = source[match.start():close]
              if "pvewhmcs_admin_csrf_input()" not in block:
                  missing.append(index)

          if missing:
              raise SystemExit(f"POST forms missing CSRF helper: {missing}")

          required = [
              "$_SERVER['REQUEST_METHOD'] === 'POST'",
              "function_exists('check_token')",
              "check_token();",
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f"missing global POST CSRF guard: {token}")

          mutation_functions = [
              "import_guest",
              "save_config",
              "save_qemu_plan",
              "update_qemu_plan",
              "save_lxc_plan",
              "update_lxc_plan",
              "save_ip_pool",
              "add_ip_2_pool",
              "remove_plan",
              "removeIpPool",
              "removeip",
          ]

          function_starts = list(re.finditer(
              r'(?m)^\s*function\s+([A-Za-z0-9_]+)\s*\(',
              source,
          ))
          ranges = {}
          for index, match in enumerate(function_starts):
              name = match.group(1)
              end = function_starts[index + 1].start() if index + 1 < len(function_starts) else len(source)
              ranges[name] = source[match.start():end]

          for name in mutation_functions:
              body = ranges.get(name)
              if body is None:
                  raise SystemExit(f"mutation function not found: {name}")
              if "$_GET[" in body:
                  raise SystemExit(f"mutation function {name} reads target/state from $_GET")

          print(
              f"validated {len(form_starts)} CSRF-protected POST forms "
              f"and {len(mutation_functions)} GET-free mutation functions"
          )
          PY

      - name: Keep client and stored admin output escaped
        shell: bash
        run: |
          set -euo pipefail
          for tpl in             modules/servers/pvewhmcs/clientarea.tpl             modules/servers/pvewhmcs/reinstall.tpl
          do
            if grep -Pn '\{\$[^}]+\}' "$tpl" | grep -Pv '\|escape' ; then
              echo "Unescaped Smarty interpolation found in $tpl" >&2
              exit 1
            fi
          done

          ! grep -Fq "echo '<td>' . \$plan->title" modules/addons/pvewhmcs/pvewhmcs.php
          ! grep -Fq "echo '<td>' . \$pool->title" modules/addons/pvewhmcs/pvewhmcs.php
          ! grep -Fq "echo '<td>' . \$pool->gateway" modules/addons/pvewhmcs/pvewhmcs.php
          ! grep -Fq "value=\"' . \$config->vnc_secret" modules/addons/pvewhmcs/pvewhmcs.php

      - name: Reject raw DB/PVE object output in addon HTML
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'function list_ips($poolId)' modules/addons/pvewhmcs/pvewhmcs.php
          ! grep -Fq "where('pool_id', '=', \$_GET['id'])" modules/addons/pvewhmcs/pvewhmcs.php
          grep -Fq 'pvewhmcs_e($ipAddress)' modules/addons/pvewhmcs/pvewhmcs.php
          grep -Fq 'pvewhmcs_e($mask)' modules/addons/pvewhmcs/pvewhmcs.php
          grep -Fq 'pvewhmcs_e($serviceLink)' modules/addons/pvewhmcs/pvewhmcs.php

          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("modules/addons/pvewhmcs/pvewhmcs.php").read_text(encoding="utf-8")
          violations = []

          # Catch direct one-line echo of DB/object properties unless the
          # expression explicitly escapes or casts the value. This supplements
          # the specific historical regression assertions above.
          for number, line in enumerate(source.splitlines(), start=1):
              if "echo " not in line or "->" not in line:
                  continue
              if any(safe in line for safe in (
                  "pvewhmcs_e(",
                  "htmlspecialchars(",
                  "(int)",
                  "rawurlencode(",
                  "json_encode(",
              )):
                  continue
              # Navigation comparisons such as $_GET['tab'] contain no object
              # property and are excluded by the -> requirement above.
              if re.search(r'\$[A-Za-z_][A-Za-z0-9_]*->\w+', line):
                  violations.append((number, line.strip()))

          if violations:
              for number, line in violations:
                  print(f"raw addon object output at line {number}: {line}")
              raise SystemExit(1)
          PY

      - name: Verify secure console cookie-domain derivation
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "modules/addons/pvewhmcs/security.php";

            $cases = array(
                array("billing.example.com", "pve.example.com", ".example.com"),
                array("billing.example.co.uk", "pve.example.co.uk", ".example.co.uk"),
                array("BILLING.Example.COM.", "PVE.example.com.", ".example.com"),
                array("billing.example.com", "pve.eu.example.com", ".example.com"),
                array("billing.co.uk", "pve.co.uk", null),
                array("127.0.0.1", "pve.example.com", null),
                array("billing.example.com", "203.0.113.10", null),
                array("billing.example.com", "pve.other.net", null)
            );

            foreach ($cases as $case) {
                [$whmcs, $pve, $expected] = $case;
                $actual = pvewhmcs_console_cookie_domain($whmcs, $pve);
                if ($actual !== $expected) {
                    fwrite(
                        STDERR,
                        "cookie-domain mismatch for {$whmcs} / {$pve}: "
                        . var_export($actual, true)
                        . " expected "
                        . var_export($expected, true)
                        . "\n"
                    );
                    exit(1);
                }
            }
          '

      - name: Keep legacy custom cryptography removed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --include='*.php' 'pvewhmcs_get_whmcs_server_password'             modules/addons/pvewhmcs modules/servers/pvewhmcs
          ! grep -RInE --include='*.php' '\b(md5|sha1)\s*\('             modules/addons/pvewhmcs modules/servers/pvewhmcs
          ! grep -RInE --include='*.php' '\b(srand|mt_srand)\s*\('             modules/addons/pvewhmcs modules/servers/pvewhmcs
          ! grep -RIn --include='*.php' 'serialize($GLOBALS)'             modules/addons/pvewhmcs modules/servers/pvewhmcs
          grep -RIn --include='*.php' "localAPI('DecryptPassword'"             modules/addons/pvewhmcs modules/servers/pvewhmcs >/dev/null

      - name: Keep VNC secret encrypted and masked
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "pvewhmcs_encrypt_secret" modules/addons/pvewhmcs/security.php
          grep -Fq "pvewhmcs_ensure_secret_storage" modules/addons/pvewhmcs/security.php
          grep -Fq "WHMCS secret encryption round-trip verification failed" modules/addons/pvewhmcs/security.php
          grep -Fq "Encrypted VNC secret failed persistence integrity verification" modules/addons/pvewhmcs/security.php
          grep -Eq '`vnc_secret`[[:space:]]+text' modules/addons/pvewhmcs/db.sql
          grep -Fq 'type="password"' modules/addons/pvewhmcs/pvewhmcs.php
          ! grep -InE 'name="vnc_secret"[^>]*value="[^"]+"' modules/addons/pvewhmcs/pvewhmcs.php


          # Normal decryption must refuse plaintext completely; only the
          # explicit migration path may ever see a legacy plaintext value.
          php -r '
            function localAPI($action, $params) {
                if ($action === "DecryptPassword") {
                    return array("result" => "success", "password" => "decrypted-secret");
                }
                throw new RuntimeException("unexpected localAPI action");
            }

            require "modules/addons/pvewhmcs/security.php";

            $rejected = false;
            try {
                pvewhmcs_decrypt_secret("legacy-plaintext-secret");
            } catch (RuntimeException $e) {
                $rejected = strpos($e->getMessage(), "unencrypted") !== false;
            }

            if (!$rejected) {
                fwrite(STDERR, "plaintext module secret was accepted by normal decrypt path\n");
                exit(1);
            }

            if (pvewhmcs_decrypt_secret("enc:test-ciphertext") !== "decrypted-secret") {
                fwrite(STDERR, "encrypted module secret did not use WHMCS decrypt path\n");
                exit(1);
            }
          '

          ! grep -Fq 'return $legacyPlaintext' modules/addons/pvewhmcs/security.php
          grep -Fq 'VNC secret migration did not produce encrypted storage' modules/addons/pvewhmcs/security.php

      - name: Keep IPv4 CIDR imports bounded
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'pvewhmcs_bounded_ipv4_cidr_size($prefix, 4096)' modules/addons/pvewhmcs/pvewhmcs.php
          grep -Fq 'if ($hostBits > 12)' modules/addons/pvewhmcs/security.php
          grep -Fq 'count($rows) > 4096' modules/addons/pvewhmcs/pvewhmcs.php
          grep -Fq 'array_chunk($rows, 250)' modules/addons/pvewhmcs/pvewhmcs.php

          php -r '
            require "modules/addons/pvewhmcs/security.php";
            require "modules/addons/pvewhmcs/Ipv4/Subnet.php";

            $expected = array(
                20 => 4096,
                21 => 2048,
                31 => 2,
                32 => 1,
            );

            foreach ($expected as $prefix => $count) {
                $actual = pvewhmcs_bounded_ipv4_cidr_size($prefix, 4096);
                if ($actual !== $count) {
                    fwrite(STDERR, "unexpected size for /" . $prefix . ": " . $actual . "\n");
                    exit(1);
                }
            }

            foreach (array(-1, 0, 19, 33) as $prefix) {
                $rejected = false;
                try {
                    pvewhmcs_bounded_ipv4_cidr_size($prefix, 4096);
                } catch (InvalidArgumentException $e) {
                    $rejected = true;
                }
                if (!$rejected) {
                    fwrite(STDERR, "unsafe/invalid prefix accepted: /" . $prefix . "\n");
                    exit(1);
                }
            }

            $subnet = Ipv4_Subnet::fromString("10.20.0.0/20");
            $iterated = 0;
            foreach ($subnet->getIterator() as $ip) {
                $iterated++;
                if ($iterated > 4096) {
                    fwrite(STDERR, "subnet iterator exceeded /20 safety bound\n");
                    exit(1);
                }
            }

            if ($iterated < 1 || $iterated > 4096) {
                fwrite(STDERR, "unexpected /20 iterator cardinality: " . $iterated . "\n");
                exit(1);
            }
          '

      - name: Keep ZRLE CPU bound guard
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'if (i + length > tileSize)' modules/servers/pvewhmcs/novnc/core/decoders/zrle.js

      - name: JavaScript syntax check for patched noVNC decoder
        run: node --check modules/servers/pvewhmcs/novnc/core/decoders/zrle.js

      - name: Behaviorally validate admin plan inputs
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          chdir('modules/addons/pvewhmcs');
          require 'pvewhmcs.php';

          function validQemuPost() {
              return array(
                  'title' => 'Secure QEMU',
                  'ostype' => 'l26',
                  'cpus' => '1',
                  'cpuemu' => 'host',
                  'cores' => '2',
